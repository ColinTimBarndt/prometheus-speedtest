[package]
name = "prometheus-speedtest"
version = "1.0.1"
edition = "2024"
authors = ["Colin Tim Barndt"]
license = "GPL-3.0"

categories = ["web-programming::http-server"]
keywords = ["speedtest", "ping", "prometheus", "telemetry", "metrics"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
accept-header = "0.2.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
  "tracing",
] }
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
hickory-resolver = { version = "0.26.3", features = ["system-config"] }
http = "1.5.0"
humantime-serde = "1.1.1"
lazy_static = "1.5.1"
mime = "0.3.17"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
prometheus = "0.14.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "net",
  "macros",
  "signal",
  "rt-multi-thread",
] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typed-arena = "2.0.2"
url = { version = "2.5.8", features = ["serde"] }
